<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哔哩哔哩下载器 · B站视频下载</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">▶</span><span>哔哩哔哩下载器</span></div><span class="tag">BILIBILI VIDEO TOOL</span></header>
  <section class="hero"><div><p class="eyebrow">LOCAL DOWNLOAD WORKSPACE</p><h1>把喜欢的视频，<em>稳稳地保存下来</em></h1><p class="intro">输入 BV 号、选择保存位置和分P，剩下的交给本地下载任务。</p></div><div class="hero-badge">✦ 白天模式</div></section>
  <section class="card">
    <div class="section-title"><span class="fold">⌄</span><h2>下载设置</h2><span class="line"></span></div>
    <div class="field-row"><label for="bv">BV 号</label><input id="bv" placeholder="例如：BV1xx411c7mD 或粘贴完整视频链接"><button id="parseBtn" class="secondary">解析视频</button></div>
    <div id="videoInfo" class="video-info hidden"></div>
    <div class="field-row"><label for="targetDir">保存目录</label><input id="targetDir" value="downloads" placeholder="例如：D:\B站视频\课程"><button id="browseBtn" class="secondary">浏览...</button></div>
    <div class="field-row"><label for="parts">下载分P</label><input id="parts" placeholder="例如：1、1-3 或 1,3,5-7"><span class="hint">支持范围和逗号</span></div>
    <div class="field-row"><label for="name">文件名前缀</label><input id="name" placeholder="留空则使用 BV 号，例如：课程-"><span></span></div>
  </section>
  <section class="card options-card"><div class="section-title"><span class="fold">⌄</span><h2>输出设置</h2><span class="line"></span></div><label class="check"><input id="removeTemp" type="checkbox" checked><span class="box"></span>合并完成后删除临时音视频文件</label><p class="note">视频和音频会先分别下载，再由 FFmpeg 合并为 MP4。</p></section>
  <section class="actions"><button id="startBtn" class="primary"><span>▶</span> 开始下载</button><span id="message" class="message"></span></section>
  <section id="taskCard" class="card task-card hidden"><div class="section-title"><span class="fold">⌄</span><h2>下载进度</h2><span class="line"></span><span id="taskStatus" class="status">等待中</span></div><div class="progress-meta"><strong id="stage">等待开始</strong><span id="count">0 / 0</span></div><div class="progress"><span id="progressBar"></span></div><p id="taskError" class="error hidden"></p><div id="files" class="files"></div></section>
  <footer>仅供个人学习与合理使用 · 下载任务在本机执行</footer>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
